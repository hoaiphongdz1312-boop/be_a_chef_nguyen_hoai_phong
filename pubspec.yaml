publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  tflite_flutter: ^0.12.1
  image: ^4.10.1
  sqflite: ^2.4.4
  path: ^1.9.1
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/mobilefacenet.tflite
    - assets/data/lessons.json
